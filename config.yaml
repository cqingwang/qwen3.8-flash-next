# Qwen3.8-Flash-Next 双机部署配置（本地部署入口的 SSOT）
# deploy.sh --install 会把当前仓库同步到 repo 指定的双机目录。
common:
  user: chan
  repo: /opt/qwen3.8-flash-next
  model: /opt/models/RadixArk/Qwen3.8-Flash-Next-NVFP4
  api_url: http://127.0.0.1:8888/v1/models
  port: 8888
head:
  hostname: spark-a
  ssh: chan@192.168.2.180
  management_ip: 192.168.2.180
worker:
  hostname: spark-b
  ssh: chan@192.168.2.161
  management_ip: 192.168.2.161

# dspark/start.sh 的唯一有效环境配置；program.py --install/--gen-env
# 从这里完整生成 dspark/.env，不读取或合并已有 .env。
env:
  HEAD_IP: 10.100.240.1
  WORKER_IP: 10.100.240.2
  WORKER_USER:
  WORKER_SSH: chan@192.168.2.161
  IFACE: enp1s0f0np0
  WORKER_IFACE: enp1s0f0np0
  IB_HCA: =rocep1s0f0
  WORKER_IB_HCA: =rocep1s0f0
  IB_GID_INDEX: 3
  MODEL_ID: RadixArk/Qwen3.8-Flash-Next-NVFP4
  MODEL_PATH: /opt/models/RadixArk/Qwen3.8-Flash-Next-NVFP4
  MODEL_ROOT: /opt/models
  CONTAINER_MODEL_ROOT: /models
  SERVED_MODEL_NAME: qwen3.8-flash-next
  MAX_MODEL_LEN: 1000000
  YARN_ENABLE: true
  YARN_FACTOR: 4.0
  GPU_MEMORY_UTILIZATION: 0.835
  MAX_NUM_SEQS: 8
  MAX_NUM_BATCHED_TOKENS: 8192
  PORT: 8888
  KV_CACHE_DTYPE: auto
  TENSOR_PARALLEL_SIZE: 2
  ENABLE_EXPERT_PARALLEL: true
  MTP_NUM_SPECULATIVE_TOKENS: 3
  IMAGE: vllm/vllm-openai:qwen38-flash-next
  PLE_OFFLOAD: false
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  MASTER_PORT: 50000
  EXTRA_VLLM_ARGS:
  EXTRA_DOCKER_ARGS:
  HF_TOKEN:
